name: Kitty graphical acceptance

on:
  pull_request:
    paths:
      - "src/**"
      - "scripts/**"
      - "uv.lock"
      - "pyproject.toml"
      - ".github/scripts/phase2-kitty-gui.sh"
      - ".github/scripts/phase3-alt-screen-gui.sh"
      - ".github/scripts/phase3-multifigure-gui.sh"
      - ".github/scripts/phase3-paging-gui.sh"
      - ".github/workflows/kitty-gui.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kitty-xvfb:
    name: Native Kitty visible physical and virtual placements
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      - name: Install Kitty, Xvfb, and screenshot tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends kitty xvfb x11-apps imagemagick
      - name: Render and inspect two native Kitty placements
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a -s "-screen 0 1280x900x24" bash .github/scripts/phase2-kitty-gui.sh
      - name: Check temporary figure and restored primary screen
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a -s "-screen 0 1280x900x24" bash .github/scripts/phase3-alt-screen-gui.sh
      - name: Check multi-figure contact-sheet graphics
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a -s "-screen 0 1280x900x24" bash .github/scripts/phase3-multifigure-gui.sh
      - name: Check paged foreground Kitty panels
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a -s "-screen 0 1280x900x24" bash .github/scripts/phase3-paging-gui.sh
      - name: Upload paging screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase3-kitty-paging
          path: ${{ runner.temp }}/wskr-phase3-paging/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload multi-figure screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase3-kitty-multifigure
          path: ${{ runner.temp }}/wskr-phase3-multifigure/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload alternate-screen screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase3-kitty-alternate-screen
          path: ${{ runner.temp }}/wskr-phase3-alternate-screen/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload screenshot and emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-hosted-kitty-gui
          path: ${{ runner.temp }}/wskr-kitty-gui/
          if-no-files-found: warn
          retention-days: 14
