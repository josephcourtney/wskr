# =================================== project ====================================
[project]
  name = "wskr"
  version = "0.0.17"
  description = "Terminal image rendering backends for Matplotlib and Rich"
  readme = "README.md"
  authors = [
    { name = "Joseph M Courtney", email = "5942706+josephcourtney@users.noreply.github.com" },
  ]
  urls = { "Homepage" = "https://github.com/josephcourtney/wskr", "Bug Tracker" = "https://github.com/josephcourtney/wskr/issues" }
  license = "GPL-3.0-only"
  license-files = ["LICENSE.md"]
  classifiers = []
  requires-python = ">=3.13,<3.15"

  dependencies = [
    "darkdetect>=0.8.0",
    "matplotlib>=3.10.1",
    "numpy>=2.2.5",
    "pytest-timeout>=2.4.0",
    "rich>=14.0.0",
    "scipy>=1.15.2",
  ]

  [project.entry-points."matplotlib.backend"]
    wskr        = "wskr.render.matplotlib.core"
    wskr_kitty  = "wskr.render.matplotlib.kitty"
    wskr_sixel  = "wskr.render.matplotlib.sixel"
    wskr_iterm2 = "wskr.render.matplotlib.iterm2"

[dependency-groups]
  # Default development is deliberately semantic-engine-only.
  dev = [
    "coverage>=7.13.4",
    "hypothesis>=6.151.9",
    "import-linter>=2.10",
    "pytest-cov>=7.0.0",
    "pytest-test-categories>=1.2.1",
    "pytest-timeout>=2.4.0",
    "pytest>=9.0.2",
    # Keep accelerators installed during ordinary uv-run and just-fix cycles.
    "pytest-testmon>=2.2.0,<3",
    "pytest-xdist>=3.8,<4",
    "ruff>=0.15.2",
    "ty>=0.0.17",
  ]

  # Install explicitly with: uv sync --group quality
  quality = [
    "mutmut>=3.4.0",
    "pytest-randomly>=4.0.1",
    "radon>=6.0.1",
    "vulture>=2.14",
  ]

# =================================== build ====================================
[build-system]
  requires      = ["uv_build>=0.12.0,<0.13.0"]
  build-backend = "uv_build"

[[tool.uv.index]]
  name        = "testpypi"
  url         = "https://test.pypi.org/simple/"
  publish-url = "https://test.pypi.org/legacy/"
  explicit    = true

[[tool.uv.index]]
  name        = "pypi"
  url         = "https://pypi.org/simple/"
  publish-url = "https://upload.pypi.org/legacy/"

# ==================================== lint ====================================
[tool.ruff]
  extend         = "./ruff.default.toml"
  extend-exclude = []
  target-version = "py313"

  [tool.ruff.lint]
    unfixable = [
      "F841", # remove assignment to unused variable
    ]

    extend-ignore = []

# =================================== test ===================================
[tool.pytest.ini_options]
  minversion = "9.0"
  testpaths = ["tests"]
  python_files = ["test_*.py"]
  # With --import-mode=importlib, expose repository-local tooling to its tests.
  pythonpath = ["."]
  addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
    "--import-mode=importlib",
    "--cov=wskr",
    "--cov-branch",
    "--cov-report=",
    "--timeout-method=thread",
    "--test-categories-enforcement=off",
    "--test-categories-distribution-enforcement=off",
  ]
  xfail_strict = true

  log_cli              = false
  log_cli_level        = "INFO"
  log_cli_format       = "%(asctime)s [%(levelname)s] %(name)s - %(message)s"
  log_cli_date_format  = "%Y-%m-%d %H:%M:%S"
  console_output_style = "progress"

  norecursedirs = [
    ".hypothesis",
    ".git",
    ".tox",
    ".venv",
    "dist",
    "build",
    ".pytest_cache",
    ".eggs",
    ".uv",
    ".cache",
  ]

  filterwarnings = [
    "ignore::DeprecationWarning:pkg_resources",
    "ignore::DeprecationWarning:distutils",
    "ignore::UserWarning:hypothesis",
    "ignore:`use_rich_markup=` will be deprecated.*:PendingDeprecationWarning:rich_click.*",
  ]

  markers = [
    # Size categories used by pytest-test-categories.
    "small: Fast, isolated tests with no external I/O.",
    "medium: In-process component tests with bounded I/O or integration.",
    "large: Multi-component or external-dependency tests.",
    "xlarge: Full-system or expensive tests.",

    # Structural levels
    "unit: Fast, isolated tests of individual functions/classes. No real I/O or global state.",
    "component: Tests of a bounded context via public APIs with in-process fakes.",
    "integration: Tests involving real external dependencies (DB, queues, containers, external services).",
    "system: Full system / end-to-end tests treating the app as a black box.",
    "contract: Service/API or data/schema contract tests.",

    # Purpose markers
    "acceptance: Requirement-driven system tests tied to user stories or acceptance criteria.",
    "regression: Prevent re-introduction of known bugs or failures.",
    "sanity: Narrow checks verifying specific bugfixes or features.",
    "smoke: Fast, critical-path tests run before larger suites.",
    "performance: Performance tests (latency, throughput, resource usage).",
    "performance_regression: Tests comparing runtime metrics to stored baselines.",
    "security: Security-focused tests.",
    "fuzz: Fuzzing-style tests feeding malformed/randomized inputs.",
    "chaos: Chaos/resilience tests injecting faults/disruptions.",
    "privacy: Privacy-impact tests ensuring correct PII/data handling.",
    "data_quality: Tests of data integrity, freshness, referential integrity, etc.",
    "drift: Model/data drift detection tests (PSI, KS, etc.).",
    "usability: Automated usability tests (accessibility, i18n).",
    "synthetic_monitoring: Synthetic production probes.",

    # Technique / infra
    "snapshot: Snapshot-based tests.",
    "property_based: Property-based tests (Hypothesis).",
    "mutation: Mutation-testing related.",
    "observability: Tests asserting presence/shape of logs/metrics/traces.",

    # Operational/meta
    "slow: Known slow tests.",
    "flaky: Flaky tests under triage.",
    "legacy: Legacy tests awaiting refactor/removal.",
    "experimental: Experimental tests or tooling not yet mandatory.",
    "external_data: Tests requiring external vendor data.",

    # Domain-specific
    "db: Database behavior tests.",
    "api: API-centric tests (HTTP/RPC).",
    "ml: ML-related tests.",
    "ui: UI-layer tests (web, CLI).",
  ]


# =================================== test:coverage ===================================
[tool.coverage.run]
  core     = "ctrace"
  source   = ["wskr"]
  branch   = true
  parallel = true
